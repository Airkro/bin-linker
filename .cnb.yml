version: '1.0'

patch:
  push:
    # 原有环境镜像已失效，改用官方镜像还原 dockerfile 里的 pnpm 环境
    - name: 构建与测试
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: node:lts-alpine
      # pnpm 的全局目录、全局 bin 与 store 都放在工作区之外，
      # 才能用下面带 cache 的 volumes 在构建间保留。
      # 注意 docker.volumes 里的 path 就是容器内挂载点，
      # 与流水线挂入的 /workspace 互为包含时容器起不来，所以缓存一律走 stage 级 volumes。
      env:
        XDG_DATA_HOME: /home/.share
        PNPM_HOME: /home/.share/pnpm
        PATH: /home/.share/pnpm/bin:/home/.share/pnpm:$PATH
      stages:
        - name: 预热 pnpm
          script: |
            pnpm config set storeDir /home/.share/pnpm/store --global
            pnpm root -g
        - name: 安装依赖
          script: pnpm i --ignore-scripts
          volumes:
            - /home/.share/pnpm
        - name: 类型检查
          script: pnpm run lint:type
        - name: 构建源码
          script: pnpm run build
        # 全局装一份 miniprogram-ci，再用仓库构建出的 bin-linker 链接它
        - name: 全局安装 miniprogram-ci
          script: pnpm add -g miniprogram-ci
          volumes:
            - /home/.share/pnpm
        - name: 链接 miniprogram-ci
          script: node ./lib/index.mjs miniprogram-ci
        - name: 验证链接结果
          script: npx --no miniprogram-ci -v

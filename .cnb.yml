version: '1.0'

patch:
  push:
    # 原环境镜像已失效，改用官方镜像 + 手工装 pnpm（node 官方镜像自 25 起不再自带 corepack）。
    - name: 构建与测试
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: node:lts-alpine
        # 数据卷只能在这里声明（stage / job 没有 volumes 配置项）。
        # path 即容器内挂载点，不能与流水线挂入的 /workspace 互为包含，
        # 所以 pnpm 的 store 与全局目录都放在 /home/.share 下。
        volumes:
          - /home/.share:copy-on-write
      # 不能用 $PATH 拼接：声明在 env 里的 PATH 会先参与变量替换，
      # 此时 $PATH 还是空的，冒号后的内容会被当成命令执行。
      # npm 全局安装的前缀（/home/.share/npm）只放 node_modules 与 bin，
      # 不放 PNPM_HOME——两者相同会让 bin/pnpm 自链成环（报 Symbolic link loop）。
      env:
        XDG_DATA_HOME: /home/.share
        PNPM_HOME: /home/.share/pnpm
        NPM_CONFIG_PREFIX: /home/.share/npm
        # 指向真实 pnpm 安装目录而不是 bin 目录，既满足 pnpm 10 的 PATH 校验，也不会成环
        PATH: /home/.share/npm/lib/node_modules/pnpm/bin:/home/.share/pnpm:/home/.share/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # pnpm 在没有 TTY 的环境里只渲染进度条、不打印明细行（下载阶段尤其久），
      # 会撞上 10 分钟无输出超时（构建 cnb-mh6-1k6ai12q5）。
      # timeout 同时抬高「无输出超时」与「单任务最长执行时间」。
      timeout: 30m
      stages:
        # 不用 corepack：它没有 packageManager 字段时会去 registry 取 pnpm 最新版，
        # 下载阶段没有任何输出，会撞上无输出超时（构建 cnb-q73-1k6agsf87）。
        - name: 安装 pnpm
          script: |
            pnpm_version=$(node -p "require('./package.json').packageManager.split('@')[1]")
            npm i -g "pnpm@$pnpm_version"
            pnpm -v
        - name: 预热 pnpm
          script: |
            pnpm config set store-dir /home/.share/pnpm/store --global
            pnpm root -g
        # 依赖进 store 之后，后面全局装 miniprogram-ci 才能大比例命中缓存
        - name: 安装依赖
          script: pnpm i --ignore-scripts
        - name: 类型检查
          script: pnpm run lint:type
        - name: 构建源码
          script: pnpm run build
        # 全局装一份 miniprogram-ci，再用仓库构建出的 bin-linker 链接它
        - name: 全局安装 miniprogram-ci
          script: pnpm add -g miniprogram-ci
        - name: 链接 miniprogram-ci
          script: node ./lib/index.mjs miniprogram-ci
        # miniprogram-ci 没有 -v 参数，`npx --no miniprogram-ci -v` 拿到的是 npx 自身的版本，
        # 这里改为校验链接本身：软链存在、且用 node 执行时能走到它自己的入口。
        - name: 验证链接结果
          script: |
            test -L node_modules/.bin/miniprogram-ci
            node node_modules/.bin/miniprogram-ci 2>&1 | grep -q 'projectPath should not be empty'

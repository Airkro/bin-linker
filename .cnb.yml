version: '1.0'

patch:
  push:
    # 原环境镜像已失效，改用官方镜像 + corepack 装 pnpm（node 官方镜像自 25 起不再自带 corepack，
    # 所以从 npm 取一份 corepack，再用它按 packageManager 字段准备 pnpm 版本）。
    - name: 构建与测试
      runner:
        tags:
          - cnb:arch:amd64
      docker:
        image: node:lts-alpine
        # 数据卷只能在这里声明（stage / job 没有 volumes 配置项）。
        # path 即容器内挂载点，不能与流水线挂入的 /workspace 互为包含，
        # 所以 pnpm 的 store 与全局目录都放在 /home/.share 下。
        volumes:
          - /home/.share:copy-on-write
      # 不能用 $PATH 拼接：声明在 env 里的 PATH 会先参与变量替换，
      # 此时 $PATH 还是空的，冒号后的内容会被当成命令执行。
      # npm 全局安装的前缀（/home/.share/npm）只放 node_modules 与 bin，
      # 不放 PNPM_HOME——两者相同会让 bin/pnpm 自链成环（报 Symbolic link loop）。
      env:
        XDG_DATA_HOME: /home/.share
        PNPM_HOME: /home/.share/pnpm
        NPM_CONFIG_PREFIX: /home/.share/npm
        # 构建机直连 registry.npmjs.org 会卡在下载阶段（静默、随机、时快时慢），
        # 统一走腾讯云镜像。写 env 而不是 .npmrc：不影响本地与发布（publishConfig 仍指 npmjs），
        # 且 npm / pnpm / npx 都读 npm_config_* 变量，一处生效。
        NPM_CONFIG_REGISTRY: https://mirrors.cloud.tencent.com/npm
        # corepack 不读 .npmrc，裸下 pnpm 时固定走 registry.npmjs.org，镜像必须单独指定：
        # 它拿这个地址去取 pnpm 的 tarball，和上面的 npm 源是两条独立的下载链路。
        COREPACK_NPM_REGISTRY: https://mirrors.cloud.tencent.com/npm
        COREPACK_HOME: /home/.share/corepack
        # corepack 首次安装 pnpm 时会在 TTY 上问一句「是否下载」，构建里没人应答就会干等到超时
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        # corepack 的 shim 落在 PNPM_HOME/bin，真实 pnpm 在 COREPACK_HOME/v1/pnpm/<版本>/bin：
        # 两个 bin 都在 PATH 里，既满足 pnpm 10/11/12 的 PATH 校验，shim 也不会指向自己
        PATH: /home/.share/pnpm/bin:/home/.share/pnpm:/home/.share/npm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # 下载慢的根因是网络（见上面的 registry），镜像解决之后 timeout 只是兜底：
      # 真挂住时别再干等 10 分钟才报错。timeout 同时抬高「无输出超时」与「最长执行时间」。
      timeout: 30m
      stages:
        # node 官方镜像从 25 起不再自带 corepack，从 npm 取一份（走 NPM_CONFIG_REGISTRY 的镜像），
        # 再软链出 pnpm。不直接 `npm i -g pnpm`：pnpm 10 起要求自身的 bin 目录在 PATH 里，
        # 装 pnpm 本体和 shim 落到同一目录会自链成环（曾报 Symbolic link loop）。
        # 下载链路偶发静默挂住（曾撞上无输出超时，构建 cnb-q73-1k6agsf87），
        # 用 timeout 兜底：真挂住就尽快失败并打出是哪一步，别干等到天亮。
        # --install-directory 给的是静态目录而不用 $PNPM_HOME：corepack 会把展开后的字面量
        # 写进 shim 脚本，真出问题时直接在 shim 里就能看到它指向哪。
        - name: 安装 corepack
          script: |
            mkdir -p "$PNPM_HOME/bin"
            timeout 600 npm i -g corepack || { echo "npm corepack failed"; exit 1; }
            corepack --version
            corepack enable --install-directory /home/.share/pnpm/bin
        # 先把 pnpm 本体落进 corepack 的 cache：给出版本号而不是范围，
        # 省掉一次 registry 查询，也不依赖镜像的 dist-tags。
        # 顺带一条铁律：corepack 首次安装时要在 TTY 上问「是否下载」，CI 里无人应答会挂死，
        # 所以 env 里关掉了 prompt，这里再显式指定版本，别让它去猜。
        - name: 预装 pnpm
          script: |
            pnpm_version=$(node -p "require('./package.json').packageManager.split('@')[1]")
            echo "corepack installing pnpm@$pnpm_version from $COREPACK_NPM_REGISTRY"
            timeout 600 corepack install --global "pnpm@$pnpm_version" || { echo "corepack install failed"; exit 1; }
            echo "pnpm version: $(pnpm -v)"
            echo "pnpm shim: $(readlink -f "$(command -v pnpm)")"
            echo "corepack cache: $(ls "$COREPACK_HOME/v1/pnpm" 2>/dev/null | tr '\n' ' ')"
            echo "corepack lastKnownGood: $(cat "$COREPACK_HOME/lastKnownGood.json" 2>/dev/null)"
            echo "node: $(node -v), npm: $(npm -v)"
            # 下载走的是哪条链路，钉死在构建日志里。
            # 必须经 echo 输出：`npm config get` 的 stdout 不是 TTY 时不写终端，
            # 放在 stage 末尾等于什么都没有，最后一条命令无输出会撞上无输出超时。
            echo "npm registry: $(npm config get registry)"
            echo "corepack registry: $COREPACK_NPM_REGISTRY"
        - name: 预热 pnpm
          script: |
            pnpm config set store-dir /home/.share/pnpm/store --global
            echo "pnpm registry: $(pnpm config get registry)"
            pnpm root -g
        # 依赖进 store 之后，后面全局装 miniprogram-ci 才能大比例命中缓存
        - name: 安装依赖
          script: pnpm i --ignore-scripts
        - name: 类型检查
          script: pnpm run lint:type
        - name: 构建源码
          script: pnpm run build
        # 全局装一份 miniprogram-ci，再用仓库构建出的 bin-linker 链接它
        - name: 全局安装 miniprogram-ci
          script: pnpm add -g miniprogram-ci
        - name: 链接 miniprogram-ci
          script: node ./lib/index.mjs miniprogram-ci
        # miniprogram-ci 没有 -v 参数，`npx --no miniprogram-ci -v` 拿到的是 npx 自身的版本，
        # 这里改为校验链接本身：软链存在、且用 node 执行时能走到它自己的入口。
        # 入口一启动就先校验参数，抛 projectPath should not be empty——错误发生在
        # require('moment') 之前，所以这一步绿了也证明不了依赖还在。
        - name: 验证链接结果
          script: |
            test -L node_modules/.bin/miniprogram-ci
            node node_modules/.bin/miniprogram-ci 2>&1 | grep -q 'projectPath should not be empty'
        # 上一步只验证到「参数校验」，依赖解析是另一回事，单独复现。
        # 站在 node_modules 里的软链上解析一次 moment——这一步不需要 appid 与私钥，
        # 也不联网，跑完就能看出 bin-linker 建完软链之后依赖还在不在。
        - name: 复现 moment 依赖解析
          script: |
            node fixtures/moment-repro/check-moment.cjs node_modules/miniprogram-ci
        # 再加一份工程自备 moment 的对照组：真实小程序工程里往往就装着 moment，
        # 有它兜着 moment 才解析得到。两组一起才是完整现场。
        - name: 对照：工程自备 moment
          script: |
            rm -rf ./moment-repro-app
            cp -r fixtures/moment-repro/apps/demo ./moment-repro-app
            cd ./moment-repro-app
            npm i --no-audit --no-fund
            ln -sfn "$(pnpm root -g)/miniprogram-ci" node_modules/miniprogram-ci
            node ../fixtures/moment-repro/check-moment.cjs node_modules/miniprogram-ci
